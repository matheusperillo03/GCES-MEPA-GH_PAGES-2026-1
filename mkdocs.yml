site_name: GCES - MEPA
site_description: Documentação do projeto da disciplina GCES focado em contribuições ao software livre MEPA.
site_author: Grupo GCES
repo_url: https://github.com/matheusperillo03/GCES-MEPA-GH_PAGES-2026-1
repo_name: GCES MEPA - 2026.1
theme:
  name: material
  language: pt-BR
  logo: assets/favicoMEPA.png
  favicon: assets/favicoMEPA.png
  icon:
    repo: fontawesome/brands/github


nav:
  - Início: index.md
  - Sprints:
      - Sprint 0: paginas/sprints/sprint0.md
      - Sprint 1: paginas/sprints/sprint1.md
  - Reuniões:
      - Ata 1: paginas/atas/ata1.md
  - Contribuições Individuais:
    - Marcos Bezerra: paginas/contribuicoes/marcos.md
    - Caio Sabino: paginas/contribuicoes/caio.md
    - Vitor Hoffmann: paginas/contribuicoes/vitor-hoffmann.md
    - Matheus Barros: paginas/contribuicoes/matheus-barros.md
    - Matheus Perillo: paginas/contribuicoes/matheus-perillo.md
    - Bruno Vasconcelos: paginas/contribuicoes/bruno.md
    - Ranni Heller: paginas/contribuicoes/ranni.md
    - Integrante 8: paginas/contribuicoes/nomeintegrante.md

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: false

extra_css:
  - stylesheets/extra.css
