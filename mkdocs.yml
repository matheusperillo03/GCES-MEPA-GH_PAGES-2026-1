site_name: GCES - MEPA
site_description: Documentação do projeto da disciplina GCES focado em contribuições ao software livre MEPA.
site_author: Grupo GCES
theme:
  name: material
  language: pt-BR
  logo: assets/favicoMEPA.png
  favicon: assets/favicoMEPA.png


nav:
  - Início: index.md
  - Sprints:
      - Sprint 0: paginas/sprints/sprint0.md
  - Relatórios:
      - Relatório Sprint 0: paginas/relatorios/relatorio0.md
  - Reuniões:
      - Ata 1: paginas/atas/ata0.md
  - Contribuições:
    - Marcos Bezerra: paginas/contribuicoes/marcos.md
    - Integrante 2: paginas/contribuicoes/nomeintegrante.md
    - Integrante 3: paginas/contribuicoes/nomeintegrante.md
    - Integrante 4: paginas/contribuicoes/nomeintegrante.md
    - Integrante 5: paginas/contribuicoes/nomeintegrante.md
    - Integrante 6: paginas/contribuicoes/nomeintegrante.md
    - Integrante 7: paginas/contribuicoes/nomeintegrante.md
    - Integrante 8: paginas/contribuicoes/nomeintegrante.md

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
